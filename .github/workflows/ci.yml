# Builds every pull request and every push to main with the same `npm run build`
# the release workflow runs: tsc, svelte-check, the unit tests, the production
# bundle and the mobile-safety check. A broken build shows up here, not on the
# day a release tag is pushed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: don't leave a token in .git/config for the build to read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      # The Community directory's review lints every release with these rules.
      - run: npm run lint

      - run: npm run build
